<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Davlatlar</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Davlatlar haqida ma'lumotlar</h1>
        <button class="toggle"><i class="far fa-moon moon fas">Tunggi rejim</i></button>
    </div>
      <div class="container">
        <div class="form-control">
          <input type="text" placeholder="Davlatni izlang..." class="search">
          <i class="fas fa-search search"></i>
        </div>
        <!-- search part end -->
        <div class="dropDownCon">
          <div class="dropDown">
            <p id="saralash">Saralash</p>
            <button><i class="fas fa-chevron-down"></i></button>
          </div>
          <div class="drop showDropDown">
            <p class="region">All</p>
            <p class="region">Africa</p>
            <p class="region">America</p>
            <p class="region">Asia</p>
            <p class="region">Europe</p>
            <p class="region">Oceania</p>
          </div>
        </div>
        <!-- dropDown end -->
      </div>
      <div class="countries">
        <!-- <div class="country">
         
        </div> -->
      </div>
      
    <script src="./app.js"></script>
</body>
</html>
